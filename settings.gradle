pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = uri("https://maven.fabricmc.net/") }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "net.fabricmc.fabric-loom") {
                useVersion(providers.gradleProperty("loom_version").orElse("1.3"))
            }
        }
    }
}

rootProject.name = "seedreverser"