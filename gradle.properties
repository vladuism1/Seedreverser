# Gradle Properties for Seedreverser
# Note: Gradle build requires Fabric Loom plugin - use IntelliJ IDEA to build

# Fabric Loom (Gradle plugin for Fabric mod development)
# Version 0.13 compatible with MC 1.20.x; for MC 1.21.4 use IntelliJ build
loom_version=0.13

# Minecraft version (26.2 = 1.21.4)
minecraft_version=1.21.4
minecraft_library_version=26.2

# Fabric Loader
loader_version=0.16.9

# Fabric API
fabric_api_version=0.100.0+1.21.4

# Seedfinding Libraries (pinned to SeedcrackerX-compatible versions)
latticg_version=1.0.0
seedfinding_math_version=1.0.0
seedfinding_seed_version=1.0.0
seedfinding_core_version=1.0.0
seedfinding_noise_version=1.0.0
seedfinding_biome_version=1.0.0
seedfinding_terrain_version=1.0.0
seedfinding_feature_version=1.0.0
seedfinding_reversal_version=1.0.0

# Project metadata
version=1.0.0
group=com.vladuism.seedreverser