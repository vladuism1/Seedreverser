// noinspection GroovyAssignabilityCheck
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.version
group = project.group

base {
    archivesName = "seedreverser"
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            repositories.maven {
                url = uri("https://maven.seedfinding.com/")
            }
        }
        filter {
            includeModule("com.seedfinding", "latticg")
        }
    }

    maven { url = uri("https://maven.seedfinding.com/") }
    maven { url = uri("https://maven-snapshots.seedfinding.com/") }
    maven { url = uri("https://jitpack.io") }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        register("seedreverser") {
            sourceSet(sourceSets.named("main").get())
        }
    }
}

dependencies {
    // Standard Fabric/Minecraft Dependencies
    minecraft "com.mojang:minecraft:${project.minecraft_library_version}"
    // No mappings line — 26.2 is unobfuscated
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // SeedFinding Libraries — pinned to SeedcrackerX-compatible versions (MIT licensed)
    include("com.seedfinding:latticg:${project.latticg_version}") { transitive = false }

    include("com.seedfinding:mc_math:${project.seedfinding_math_version}") { transitive = false }
    include("com.seedfinding:mc_seed:${project.seedfinding_seed_version}") { transitive = false }
    include("com.seedfinding:mc_core:${project.seedfinding_core_version}") { transitive = false }
    include("com.seedfinding:mc_noise:${project.seedfinding_noise_version}") { transitive = false }
    include("com.seedfinding:mc_biome:${project.seedfinding_biome_version}") { transitive = false }
    include("com.seedfinding:mc_terrain:${project.seedfinding_terrain_version}") { transitive = false }
    include("com.seedfinding:mc_feature:${project.seedfinding_feature_version}") { transitive = false }
    include("com.seedfinding:mc_reversal:${project.seedfinding_reversal_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from(sourceSets.main.output) {
        include "kaptainwutax/**"
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from(components.named('java').get())
        }
    }
}